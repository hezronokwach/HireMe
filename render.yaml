# Render Blueprint for the API. The database is on Neon, not Render.
# In Render: New → Blueprint, pick this repo. Values marked "sync: false" are asked for when the
# Blueprint is first applied and are never stored here. Full steps: DEPLOYMENT.md.

services:
  - type: web
    name: hireme-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free # sleeps when idle; the first request after that takes about a minute
    region: frankfurt # next to Neon's aws-eu-central-1 (Frankfurt)
    branch: main
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: docker
      - key: PORT # the port the app listens on (Dockerfile EXPOSE)
        value: "8080"
      # Neon, in JDBC form, with the direct (not -pooler) host:
      # jdbc:postgresql://ep-xxx.eu-central-1.aws.neon.tech/neondb?sslmode=require
      - key: DATABASE_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # The Vercel app's origin, e.g. https://hireme.vercel.app (no trailing slash), for CORS.
      - key: FRONTEND_URL
        sync: false
      # "true" turns on the AI features; then GROQ_API_KEY is needed too.
      - key: HIREME_AI_ENABLED
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: SPRING_JPA_SHOW_SQL
        value: "false"
      # A few connections are plenty for one instance and stay well inside Neon's free limits.
      - key: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
        value: "5"
      - key: JAVA_TOOL_OPTIONS # keep the JVM inside a small instance's memory
        value: -XX:MaxRAMPercentage=75
