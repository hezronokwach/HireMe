<mat-toolbar class="header">
  <a class="brand" routerLink="/">HireMe</a>
  <span class="spacer"></span>
  @if (auth.currentSession(); as session) {
    <span class="user" data-testid="current-user">
      <span class="email">{{ session.email }}</span>
      <span class="role">{{ roleLabels[session.role] }}</span>
    </span>
    <button mat-stroked-button type="button" (click)="auth.logout()">
      <mat-icon>logout</mat-icon>
      Log out
    </button>
  } @else {
    <a mat-button routerLink="/login">Log in</a>
    <a mat-flat-button routerLink="/register">Create account</a>
  }
</mat-toolbar>

<main class="content">
  <router-outlet />
</main>
