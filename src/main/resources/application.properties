spring.application.name=HireMe
spring.profiles.active=dev

# JWT Configuration
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# Security Configuration
app.frontend-url=http://localhost:5173

# JPA Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Flyway Configuration
# db/migration/common runs on every database; db/migration/{vendor} holds vendor-specific scripts.
spring.flyway.locations=classpath:db/migration/common,classpath:db/migration/{vendor}
# Databases created by Hibernate before Flyway was added are marked as version 1 (the baseline).
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# API docs (springdoc): /v3/api-docs and /swagger-ui.html. Set both to false to turn them off.
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# AI features (ai module): Groq through its OpenAI-compatible API. Off unless HIREME_AI_ENABLED=true,
# which also needs GROQ_API_KEY. Never commit a key.
hireme.ai.enabled=${HIREME_AI_ENABLED:false}
hireme.ai.api-key=${GROQ_API_KEY:}
hireme.ai.base-url=https://api.groq.com/openai/v1
hireme.ai.model=llama-3.3-70b-versatile
hireme.ai.timeout=20s
hireme.ai.max-retries=1
hireme.ai.max-tokens=1024
hireme.ai.requests-per-minute=10
