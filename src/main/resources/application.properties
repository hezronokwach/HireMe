spring.application.name=HireMe
spring.profiles.active=dev

# JWT Configuration
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# Security Configuration
app.frontend-url=http://localhost:5173

# JPA Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Flyway Configuration
# db/migration/common runs on every database; db/migration/{vendor} holds vendor-specific scripts.
spring.flyway.locations=classpath:db/migration/common,classpath:db/migration/{vendor}
# Databases created by Hibernate before Flyway was added are marked as version 1 (the baseline).
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
