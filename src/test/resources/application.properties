spring.datasource.url=jdbc:h2:mem:testdb;MODE=POSTGRESQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
# H2 in PostgreSQL mode reports itself as PostgreSQL, so {vendor} would pick the PostgreSQL-only
# scripts. Run only the portable ones here.
spring.flyway.locations=classpath:db/migration/common
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

app.jwt.secret=test-only-jwt-secret-not-used-outside-tests-0000
app.jwt.expiration-ms=3600000
app.frontend-url=http://localhost:5173

spring.liquibase.enabled=false
spring.modulith.verify-strict=false
