name: CI/CD Pipeline (Staging & Main)

on:
  push:
    branches: [ staging, main ]

permissions:
  contents: write
  packages: write

jobs:
  # 1. Build, Run Tests & Update SonarQube Branch Status
  build-and-analyze:
    name: Build & SonarQube Update
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Cache Sonar packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Run Verify & Update Sonar Dashboard
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          ./mvnw clean verify sonar:sonar \
            -Dsonar.branch.name=${{ github.ref_name }}

      - name: Package Application JAR
        run: ./mvnw package -DskipTests

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hireme-app-${{ github.ref_name }}
          path: target/*.jar

  # 2. Deployment to Staging Environment
  deploy-staging:
    name: Deploy to Staging
    needs: build-and-analyze
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: hireme-app-staging

      - name: Execute Staging Deployment
        run: |
          echo "Deploying HireMe application to Staging environment..."
          # Add your staging deployment step here (e.g. docker build & push, AWS ECS, K8s apply, etc.)

  # 3. Deployment to Production Environment
  deploy-production:
    name: Deploy to Production
    needs: build-and-analyze
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: hireme-app-main

      - name: Execute Production Deployment
        run: |
          echo "Deploying HireMe application to Production environment..."
          # Add your production deployment step here
